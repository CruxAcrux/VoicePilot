# VoicePilot — Default Configuration
# This file is read on first launch. User overrides are stored in ~/.config/voicepilot/config.toml

[app]
name = "VoicePilot"
version = "0.1.0"
data_dir = "~/.local/share/voicepilot"
log_dir = "~/.local/share/voicepilot/logs"

[speech]
# Activation mode: "wake_word" | "push_to_talk" | "always_on"
activation_mode = "wake_word"
wake_word = "hey pilot"
# Whisper model: "tiny.en" | "base.en" | "small.en" | "medium.en"
whisper_model = "base.en"
whisper_device = "cpu"           # "cpu" | "cuda"
whisper_compute_type = "int8"    # "int8" | "float16" | "float32"
language = "en"
# Microphone index — leave commented out to use the system default device.
# TOML has no null literal; an unset key is how "no value" is expressed.
# microphone_index = 1
sample_rate = 16000
vad_threshold = 0.5              # Voice activity detection sensitivity (0.0–1.0)
# Silence duration (seconds) before finalizing speech chunk
silence_duration = 1.2
max_recording_seconds = 30

[confirmation]
# Timeout (seconds) to wait for voice confirmation before auto-cancel
timeout_seconds = 10
# Medium-risk requires one "confirm"; high-risk requires full phrase
high_risk_phrase = "confirm delete"
medium_risk_phrase = "confirm"
cancel_phrase = "cancel"

[dictation]
# How text is injected into the focused window
# "xdotool" | "clipboard" | "auto"
injection_method = "auto"
# Words per minute typing simulation delay (0 = instant)
typing_delay_ms = 0

[ui]
# Position of the overlay HUD: "top-right" | "top-left" | "bottom-right" | "bottom-left"
overlay_position = "top-right"
overlay_opacity = 0.92
theme = "dark"                   # "dark" | "light"
show_transcription = true        # Show live transcription in overlay
font_size = 13

[feedback]
tts_enabled = true
tts_engine = "espeak"            # "espeak" | "pyttsx3"
tts_rate = 170                   # Words per minute
tts_volume = 0.9
sound_effects = true

[logging]
level = "INFO"                   # "DEBUG" | "INFO" | "WARNING" | "ERROR"
max_file_size_mb = 10
backup_count = 3
log_commands = true              # Write executed commands to audit log

[security]
# Commands allowed through the shell executor (whitelist)
shell_command_whitelist = [
    "loginctl",
    "systemctl",
    "xdg-open",
    "wmctrl",
    "xdotool",
    "locate",
    "find",
]
# Require confirmation for any subprocess call
always_confirm_shell = true

[vscode]
enabled = true
# Path to VS Code binary
binary = "code"
# Default projects directory
projects_dir = "~/projects"

[apps]
# Application name aliases — maps spoken name → executable
[apps.aliases]
"firefox" = "firefox"
"chrome" = "google-chrome"
"chromium" = "chromium-browser"
"terminal" = "gnome-terminal"
"files" = "nautilus"
"file manager" = "nautilus"
"vs code" = "code"
"vscode" = "code"
"code" = "code"
"slack" = "slack"
"discord" = "discord"
"spotify" = "spotify"
"settings" = "gnome-control-center"
"calculator" = "gnome-calculator"
"text editor" = "gedit"

[folders]
# Folder aliases — maps spoken name → path
[folders.aliases]
"home" = "~"
"desktop" = "~/Desktop"
"downloads" = "~/Downloads"
"documents" = "~/Documents"
"pictures" = "~/Pictures"
"music" = "~/Music"
"videos" = "~/Videos"
"projects" = "~/projects"
