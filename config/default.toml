# VoicePilot — Standardkonfiguration
# Denna fil läses in vid första start. Användarens egna inställningar sparas i ~/.config/voicepilot/config.toml

[app]
name = "VoicePilot"
version = "0.1.0"
data_dir = "~/.local/share/voicepilot"
log_dir = "~/.local/share/voicepilot/logs"

[speech]
# Aktiveringsläge: "wake_word" | "push_to_talk" | "always_on"
activation_mode = "wake_word"
# Aktiveringsfras (wake word). Finns ingen tränad svensk modell i openwakeword,
# så denna förblir engelsk även om resten av kommandona är på svenska.
wake_word = "hey jarvis"
# Whisper-modell: måste vara flerspråkig för att kunna transkribera svenska.
# "base.en" är engelsk-only och duger inte. "small" är minsta flerspråkiga
# modell som klarar korta svenska kommandon tillförlitligt.
whisper_model = "small"
whisper_device = "cpu"           # "cpu" | "cuda"
whisper_compute_type = "int8"    # "int8" | "float16" | "float32"
language = "sv"
# Mikrofonindex — låt vara utkommenterad för att använda systemets standardenhet.
# TOML saknar null-literalen; en okommenterad, ej satt nyckel är hur "inget värde" uttrycks.
# microphone_index = 1
sample_rate = 16000
vad_threshold = 0.5              # Känslighet för röstaktivitetsdetektering (0.0–1.0)
# Tystnadens längd (sekunder) innan talsegmentet slutförs
silence_duration = 1.2
max_recording_seconds = 30

[confirmation]
# Timeout (sekunder) att vänta på röstbekräftelse innan automatisk avbrytning
timeout_seconds = 10
# Medelrisk kräver ett "bekräfta"; hög risk kräver hela frasen
high_risk_phrase = "bekräfta radera"
medium_risk_phrase = "bekräfta"
cancel_phrase = "avbryt"

[dictation]
# Hur text matas in i det fokuserade fönstret
# "xdotool" | "clipboard" | "auto"
injection_method = "auto"
# Fördröjning för simulerad skrivhastighet (ord per minut) (0 = direkt)
typing_delay_ms = 0

[ui]
# Position för overlay-HUD:en: "top-right" | "top-left" | "bottom-right" | "bottom-left"
overlay_position = "top-right"
overlay_opacity = 0.92
theme = "dark"                   # "dark" | "light"
show_transcription = true        # Visa transkribering i realtid i overlayen
font_size = 13

[feedback]
tts_enabled = true
tts_engine = "espeak"            # "espeak" | "pyttsx3"
tts_rate = 170                   # Ord per minut
tts_volume = 0.9
sound_effects = true

[logging]
level = "INFO"                   # "DEBUG" | "INFO" | "WARNING" | "ERROR"
max_file_size_mb = 10
backup_count = 3
log_commands = true              # Skriv utförda kommandon till granskningsloggen

[security]
# Kommandon tillåtna genom skalexekveraren (vitlista)
shell_command_whitelist = [
    "loginctl",
    "systemctl",
    "xdg-open",
    "wmctrl",
    "xdotool",
    "locate",
    "find",
]
# Kräv bekräftelse för varje anrop till underprocess
always_confirm_shell = true

[vscode]
enabled = true
# Sökväg till VS Code-binären
binary = "code"
# Standardmapp för projekt
projects_dir = "~/projects"

[apps]
# Alias för applikationsnamn — mappar uttalat namn → körbar fil
[apps.aliases]
"firefox" = "firefox"
"chrome" = "google-chrome"
"chromium" = "chromium-browser"
"terminal" = "gnome-terminal"
"files" = "nautilus"
"file manager" = "nautilus"
"vs code" = "code"
"vscode" = "code"
"code" = "code"
"slack" = "slack"
"discord" = "discord"
"spotify" = "spotify"
"settings" = "gnome-control-center"
"calculator" = "gnome-calculator"
"text editor" = "gedit"

[folders]
# Mappalias — mappar uttalat namn → sökväg
[folders.aliases]
"home" = "~"
"desktop" = "~/Desktop"
"downloads" = "~/Downloads"
"documents" = "~/Documents"
"pictures" = "~/Pictures"
"music" = "~/Music"
"videos" = "~/Videos"
"projects" = "~/projects"
